name: Build Cupid Kernel SUSFS Inline
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang

      - name: Integrate SukiSU Ultra
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git drivers/sukisu
          echo "obj-y += sukisu/" >> drivers/Makefile
          # Tự động chèn config vào defconfig của cupid
          echo "CONFIG_SUKISU=y" >> arch/arm64/configs/vendor/cupid_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/cupid_defconfig
          echo "CONFIG_KSU_SUSFS_INLINE_HOOK=y" >> arch/arm64/configs/vendor/cupid_defconfig

      - name: Compile Kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 vendor/cupid_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3 && zip -r ../cupid-kernel-sukisu-inline.zip ./*

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Cupid-Kernel-Zip
          path: cupid-kernel-sukisu-inline.zip
